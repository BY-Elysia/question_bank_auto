# Include in the HTTPS server block. Compress only public, hashed Vite assets;
# authenticated API responses keep their existing transport/cache policy.
location /assets/ {
    proxy_pass http://127.0.0.1:5002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    expires 1y;
}
